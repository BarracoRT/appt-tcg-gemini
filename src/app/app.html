<div style="max-width: 500px; margin: 40px auto; font-family: sans-serif; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  
  <h2>🎴 Mi TCG Vault</h2>

  <!-- ➕ Sección del Formulario para añadir cartas -->
  <div style="background: #f9f9f9; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
    <h4 style="margin-top: 0;">Añadir Nueva Carta</h4>
    
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <input type="text" [(ngModel)]="nuevoId" placeholder="ID de la carta (ej: OP01-013)" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
      <input type="text" [(ngModel)]="nuevoNombre" placeholder="Nombre (ej: Roronoa Zoro)" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
      <input type="text" [(ngModel)]="nuevaRareza" placeholder="Rareza (ej: SR)" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
      
      <button (click)="agregarCarta()" style="background: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">
        ➕ Añadir al Vault
      </button>
    </div>
  </div>

  <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;" />

  <!-- 📜 Listado de cartas existentes -->
  <h4>Tu Colección</h4>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    @for (carta of cartas; track carta.id) {
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #eee; border-radius: 4px;">
        <div>
          <strong>{{ carta.id }}</strong> - {{ carta.name }} 
          <span style="font-size: 0.8em; color: #666; background: #eee; padding: 2px 6px; border-radius: 3px; margin-left: 5px;">
            {{ carta.rarity }}
          </span>
        </div>
        
        <div style="display: flex; align-items: center; gap: 10px;">
          <button (click)="restarCarta(carta)" style="padding: 2px 8px; cursor: pointer;">-</button>
          <span style="font-weight: bold; min-width: 20px; text-align: center;">{{ carta.quantity }}</span>
          <button (click)="sumarCarta(carta)" style="padding: 2px 8px; cursor: pointer;">+</button>
          
          <!-- 🗑️ Botón de eliminar definitivo -->
          <button (click)="eliminarCarta(carta)" style="background: none; border: none; cursor: pointer; color: #dc3545; font-size: 1.1em; padding: 0 5px; margin-left: 5px;" title="Eliminar carta del Vault">
            🗑️
          </button>
        </div>
      </div>
    }
  </div>

</div>
