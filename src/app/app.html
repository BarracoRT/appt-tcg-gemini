<h1>🃏 Mi TCG Vault</h1>
<p>Total de cartas diferentes en el álbum: {{ cartas.length }}</p>

<div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; font-family: sans-serif;">

  @for (carta of cartas; track carta.id) {
    <div style="border: 2px solid #4a5568; padding: 20px; border-radius: 12px; width: 220px; background-color: #f7fafc; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between;">
      
      <div>
        <p style="font-size: 12px; color: #718096; margin: 0;">{{ carta.id }}</p>
        <h3 style="color: #dd6b20; margin: 10px 0;">{{ carta.name }}</h3>
        <p style="margin: 5px 0;"><strong>Rareza:</strong> {{ carta.rarity }}</p>
        <p style="margin: 5px 0;"><strong>Cantidad:</strong> {{ carta.quantity }} uds.</p>
      </div>

      <!-- 👇 Botones para interactuar con la cantidad -->
      <div style="margin-top: 15px; display: flex; gap: 10px;">
        <button (click)="restarCarta(carta)" style="flex: 1; padding: 8px; background-color: #e2e8f0; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">-</button>
        <button (click)="sumarCarta(carta)" style="flex: 1; padding: 8px; background-color: #dd6b20; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">+</button>
      </div>

    </div>
  }

</div>
